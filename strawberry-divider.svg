<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40">
  <!-- fundo transparente -->

  <!-- linha pontilhada rosa dos dois lados -->
  <line x1="0" y1="20" x2="370" y2="20" stroke="#ff9999" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>
  <line x1="530" y1="20" x2="900" y2="20" stroke="#ff9999" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>

  <!-- morango 1 (centro-esquerda) -->
  <g transform="translate(410, 6)">
    <!-- folha -->
    <ellipse cx="10" cy="4" rx="5" ry="3" fill="#5cb85c" transform="rotate(-20,10,4)"/>
    <ellipse cx="10" cy="4" rx="5" ry="3" fill="#4cae4c" transform="rotate(20,10,4)"/>
    <!-- corpo -->
    <path d="M10,7 Q4,10 4,16 Q4,23 10,26 Q16,23 16,16 Q16,10 10,7Z" fill="#ff0042"/>
    <!-- sementes -->
    <ellipse cx="8" cy="14" rx="0.9" ry="1.1" fill="#fffafa" opacity="0.85"/>
    <ellipse cx="12" cy="14" rx="0.9" ry="1.1" fill="#fffafa" opacity="0.85"/>
    <ellipse cx="10" cy="18" rx="0.9" ry="1.1" fill="#fffafa" opacity="0.85"/>
    <ellipse cx="7" cy="19" rx="0.8" ry="1" fill="#fffafa" opacity="0.75"/>
    <ellipse cx="13" cy="19" rx="0.8" ry="1" fill="#fffafa" opacity="0.75"/>
  </g>

  <!-- morango 2 (centro) -->
  <g transform="translate(438, 4)">
    <ellipse cx="10" cy="4" rx="5.5" ry="3" fill="#5cb85c" transform="rotate(-15,10,4)"/>
    <ellipse cx="10" cy="4" rx="5.5" ry="3" fill="#4cae4c" transform="rotate(15,10,4)"/>
    <path d="M10,7 Q3,11 3,18 Q3,26 10,29 Q17,26 17,18 Q17,11 10,7Z" fill="#ff0042"/>
    <ellipse cx="8"  cy="15" rx="1" ry="1.2" fill="#fffafa" opacity="0.85"/>
    <ellipse cx="12" cy="15" rx="1" ry="1.2" fill="#fffafa" opacity="0.85"/>
    <ellipse cx="10" cy="20" rx="1" ry="1.2" fill="#fffafa" opacity="0.85"/>
    <ellipse cx="7"  cy="21" rx="0.9" ry="1.1" fill="#fffafa" opacity="0.75"/>
    <ellipse cx="13" cy="21" rx="0.9" ry="1.1" fill="#fffafa" opacity="0.75"/>
  </g>

  <!-- morango 3 (centro-direita) -->
  <g transform="translate(466, 6)">
    <ellipse cx="10" cy="4" rx="5" ry="3" fill="#5cb85c" transform="rotate(-20,10,4)"/>
    <ellipse cx="10" cy="4" rx="5" ry="3" fill="#4cae4c" transform="rotate(20,10,4)"/>
    <path d="M10,7 Q4,10 4,16 Q4,23 10,26 Q16,23 16,16 Q16,10 10,7Z" fill="#ff0042"/>
    <ellipse cx="8" cy="14" rx="0.9" ry="1.1" fill="#fffafa" opacity="0.85"/>
    <ellipse cx="12" cy="14" rx="0.9" ry="1.1" fill="#fffafa" opacity="0.85"/>
    <ellipse cx="10" cy="18" rx="0.9" ry="1.1" fill="#fffafa" opacity="0.85"/>
    <ellipse cx="7" cy="19" rx="0.8" ry="1" fill="#fffafa" opacity="0.75"/>
    <ellipse cx="13" cy="19" rx="0.8" ry="1" fill="#fffafa" opacity="0.75"/>
  </g>

  <!-- coraçõezinhos decorativos -->
  <text x="395" y="24" font-size="10" fill="#ff9999" opacity="0.8">♡</text>
  <text x="493" y="24" font-size="10" fill="#ff9999" opacity="0.8">♡</text>
  <text x="504" y="18" font-size="8" fill="#ff0042" opacity="0.6">✦</text>
  <text x="385" y="16" font-size="8" fill="#ff0042" opacity="0.6">✦</text>
